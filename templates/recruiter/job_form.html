{% extends "base.html" %}

{% block title %}
Create Job - Recruiter - Job Board & Career Portal
{% endblock %}

{% block content %}

<h1>Create Job Posting</h1>

<div class="card">

    <div class="card-body">

        <form
            class="auth-form"
            method="POST"
            action="{{ url_for('recruiter_job_create') }}"
        >

            <!-- ====================================== -->
            <!-- JOB TITLE -->
            <!-- ====================================== -->

            <div class="form-group">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ job.title if job else '' }}"
                    required
                >

            </div>

            <!-- ====================================== -->
            <!-- DESCRIPTION -->
            <!-- ====================================== -->

            <div class="form-group">

                <label for="description">
                    Job Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                >{{ job.description if job else '' }}</textarea>

            </div>

            <!-- ====================================== -->
            <!-- REQUIRED SKILLS -->
            <!-- ====================================== -->

            <div class="form-group">

                <label for="required_skills">
                    Required Skills
                </label>

                <input
                    type="text"
                    id="required_skills"
                    name="required_skills"
                    value="{{ job.required_skills if job else '' }}"
                    placeholder="e.g. Python, SQL, Communication"
                >

            </div>

            <!-- ====================================== -->
            <!-- LOCATION -->
            <!-- ====================================== -->

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ job.location if job else '' }}"
                >

            </div>

            <!-- ====================================== -->
            <!-- JOB TYPE -->
            <!-- ====================================== -->

            <div class="form-group">

                <label for="job_type">
                    Job Type
                </label>

                <input
                    type="text"
                    id="job_type"
                    name="job_type"
                    value="{{ job.job_type if job else '' }}"
                    placeholder="e.g. Full-time, Internship"
                >

            </div>

            <!-- ====================================== -->
            <!-- CATEGORY -->
            <!-- ====================================== -->

            <div class="form-group">

                <label for="category_id">
                    Category
                </label>

                <select
                    id="category_id"
                    name="category_id"
                >

                    <option value="">
                        -- Select Category --
                    </option>

                    {% for cat in categories %}

                    <option
                        value="{{ cat.id }}"
                        {{ 'selected' if job and job.category_id == cat.id else '' }}
                    >
                        {{ cat.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- ====================================== -->
            <!-- COMPANY -->
            <!-- ====================================== -->

            <div class="form-group">

                <label for="company_id">
                    Company
                </label>

                <select
                    id="company_id"
                    name="company_id"
                    required
                >

                    <option value="">
                        -- Select Company --
                    </option>

                    {% for company in companies %}

                    <option
                        value="{{ company.id }}"
                    >
                        {{ company.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- ====================================== -->
            <!-- SUBMIT BUTTON -->
            <!-- ====================================== -->

            <button
                type="submit"
                class="btn-primary"
            >
                Create Job
            </button>

        </form>

    </div>

</div>

<a href="{{ url_for('recruiter_jobs') }}">
    Back to Jobs
</a>

{% endblock %}
